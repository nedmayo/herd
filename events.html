<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | HERD</title>
    <link rel="stylesheet" href="styles.css?v=20260604">

    <!-- Favicon/Logo metadata -->
    <meta property="og:image" content="https://youareherd.org/content/herd_circle.png">
    <link rel="apple-touch-icon" href="content/Herd H purple.svg">

    <!-- Open Graph metadata for social sharing -->
    <meta property="og:title" content="Events | HERD">
    <meta property="og:description"
        content="Upcoming and past storytelling events from HERD - a women-centered storytelling platform">
    <meta property="og:image" content="content/Herd Horns.svg">
    <meta property="og:url" content="https://youareherd.org/events.html">

    <!-- Additional metadata -->
    <meta name="description"
        content="Upcoming and past storytelling events from HERD - a women-centered storytelling platform">
    <meta name="theme-color" content="#34204d">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="content/Herd H purple.svg">
    <link rel="apple-touch-icon" href="content/Herd H purple.svg">
</head>

<body>
    <!-- Navigation -->
    <div id="nav-container"></div>

    <!-- Events Content -->
    <section class="events-page-section">
        <div class="events-page-content">
            <div class="events-main">
                <div class="events-section-row" id="upcoming-events">
                    <h2 class="events-section-label">Upcoming Events</h2>
                    <div class="events-cards-grid"></div>
                </div>

                <div class="events-past-section">
                    <div class="section-top-border" aria-hidden="true"></div>
                    <div class="events-section-row" id="past-events">
                        <h2 class="events-section-label">Past Events</h2>
                        <div class="events-cards-grid"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer-container"></div>

    <script src="events-data.js?v=20260721"></script>
    <script src="navbar.js?v=20260501"></script>
    <script>
        // Load footer
        fetch('footer.html?v=20260501')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-container').innerHTML = data;
            })
            .catch(error => console.error('Error loading footer:', error));

        if (window.HERDEvents) {
            window.HERDEvents.renderEventsPage();
        }
    </script>
</body>

</html>
